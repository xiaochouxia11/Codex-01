name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
      fail-fast: false
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install pylint==3.3.9
        python -m pip install --require-hashes -r apps/sync-dashboard/backend/requirements.txt
    - name: Run offline regression tests
      run: python -m unittest discover -s tests -v
    - name: Analysing the code with pylint
      env:
        PYTHONPATH: apps/sync-dashboard
      run: |
        pylint $(git ls-files '*.py')
    - name: Test dashboard API
      working-directory: apps/sync-dashboard
      run: python -m unittest discover -s backend/tests -v
  frontend:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: apps/sync-dashboard/frontend/package-lock.json
    - run: npm ci
      working-directory: apps/sync-dashboard/frontend
    - run: npm test && npm run build
      working-directory: apps/sync-dashboard/frontend
