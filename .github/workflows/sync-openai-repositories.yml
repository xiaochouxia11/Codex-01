name: Sync OpenAI repositories

on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-openai-repositories.yml
      - scripts/sync_openai_org.py

permissions:
  contents: write

concurrency:
  group: sync-openai-repositories
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_openai_org.py discover
  sync:
    needs: discover
    name: Sync group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Synchronize public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_REPOS: ${{ toJSON(matrix.repos) }}
        run: python3 scripts/sync_openai_org.py worker
