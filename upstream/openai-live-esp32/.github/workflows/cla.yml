name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

# The upstream action updates one signature file. Serialize those writes.
# GitHub can replace a queued run; comment "recheck" if a PR remains pending.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

permissions: {}

jobs:
  cla:
    name: cla
    if: github.repository == 'openai/openai-live-esp32'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # Rerun the original failed PR check after signing.
      contents: write # Persist signatures in this repository only.
      pull-requests: write # Request signatures and lock merged PR discussions.
    steps:
      # Never check out or execute PR code in this privileged workflow.
      # Before activation, complete docs/cla-maintenance.md.
      - name: Collect and check CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        if: |
          (
            github.event_name == 'pull_request_target' &&
            (
              github.event.action == 'opened' ||
              github.event.action == 'reopened' ||
              github.event.action == 'synchronize' ||
              (github.event.action == 'closed' && github.event.pull_request.merged == true)
            )
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Pin the agreement version; never silently repurpose existing signatures.
          path-to-document: https://github.com/openai/openai-live-esp32/blob/d837e460f81aa89bd6338a3e66fd9dcf37d9b440/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: 'true'
