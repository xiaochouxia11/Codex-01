<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth browser fixture</title>
  </head>
  <body>
    <main>
      <h1>Auth browser fixture</h1>
      <section aria-label="Primary sign-in"><div id="primary"></div></section>
      <section aria-label="Secondary sign-in"><div id="secondary"></div></section>
    </main>
    <script type="module">
      import { createChatGPTAuth } from '/packages/core/dist/client/index.mjs';

      const mode = new URLSearchParams(location.search).get('mode');
      const state = {
        calls: 0,
        completed: [],
        cancelled: 0,
        errors: [],
        interactions: [],
        activation: [],
        popupOpened: false,
      };
      let settle;
      const onInteractionChange = ({ status }) => {
        state.interactions.push(status);
        sessionStorage.setItem('auth-interactions', JSON.stringify(state.interactions));
      };
      const configuration = mode?.startsWith('auth-path')
        ? { authPath: '/auth/start?fixture=1', onInteractionChange }
        : {
            adapter: {
              signIn() {
                state.calls++;
                state.activation.push(navigator.userActivation.isActive);
                if (mode === 'popup') {
                  state.popupOpened = Boolean(
                    window.open('/popup', '_blank', 'popup,width=400,height=500'),
                  );
                }
                return new Promise((resolve) => {
                  settle = resolve;
                });
              },
            },
            onSignInComplete: (result) => state.completed.push(result),
            onCancel: () => {
              state.cancelled++;
            },
            onError: (error) => state.errors.push(error),
            onInteractionChange,
          };
      const group = createChatGPTAuth(configuration);
      const presentation = mode?.endsWith('prevent-default')
        ? { onClick: (event) => event.preventDefault() }
        : {};
      const first = group.mountSignInButton(document.querySelector('#primary'), presentation);
      group.mountSignInButton(document.querySelector('#secondary'), {
        ...presentation,
        appearance: 'dark',
        size: 'compact',
        text: 'sign-in',
      });
      window.fixture = {
        state,
        resolve(status) {
          if (!settle) throw new Error('No adapter attempt is pending');
          const resolve = settle;
          settle = undefined;
          resolve({ status });
        },
        destroyFirst: () => first.destroy(),
        destroy: () => group.destroy(),
      };
    </script>
  </body>
</html>
